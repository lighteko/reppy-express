name: Deploy Express App to OCI (DEV)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "deploy할 git ref (branch/tag/sha). 비우면 default"
        required: false
  pull_request:
    branches: [dev]
    types: [closed]

jobs:
  deploy:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
      || (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image to GHCR
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/reppy-express:dev
          docker build -t $IMAGE .
          docker push $IMAGE

      - name: Deploy to OCI (SSH + docker compose)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            cd /opt/reppy

            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

            docker compose pull reppy_dev
            docker compose -f docker-compose.dev.yml up -d --no-deps reppy_dev
            docker image prune -f
