name: Deploy Express App to OCI (DEV)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "deploy할 git ref (branch/tag/sha). 비우면 default"
        required: false
      force:
        description: "true면 조건 무시하고 강제 배포"
        required: false
        default: "false"
  pull_request:
    branches: [dev]
    types: [closed]

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image to GHCR
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/reppy-express:latest
          docker build -t $IMAGE .
          docker push $IMAGE

      - name: Deploy to OCI (SSH + docker compose)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            cd /opt/reppy

            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

            docker compose pull reppy_prod
            docker compose up -d --no-deps reppy_prod
            docker image prune -f
