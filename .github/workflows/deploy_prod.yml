name: Deploy Express App to OCI (PRODUCTION)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "deploy할 git ref (branch/tag/sha). 비우면 default"
        required: false
        default: ""
  pull_request:
    branches: [main]
    types: [closed]

jobs:
  deploy:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
      || (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      OCIR_IMAGE: ${{ secrets.OCIR_REGISTRY }}/${{ secrets.OCIR_NAMESPACE }}/${{ secrets.OCIR_REPO }}:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref != '' && github.event.inputs.ref || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to OCIR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.OCIR_REGISTRY }}
          username: ${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_AUTH_TOKEN }}

      - name: Build and push Docker image to OCIR
        run: |
          echo "Building: $OCIR_IMAGE"
          docker build -t "$OCIR_IMAGE" .
          docker push "$OCIR_IMAGE"

      - name: Deploy to OCI (SSH + docker compose)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            set -e
            cd /opt/reppy

            echo "${{ secrets.OCIR_AUTH_TOKEN }}" | docker login "${{ secrets.OCIR_REGISTRY }}" \
              -u "${{ secrets.OCIR_USERNAME }}" --password-stdin

            docker compose pull reppy_prod
            docker compose up -d --no-deps reppy_prod
            docker image prune -f
